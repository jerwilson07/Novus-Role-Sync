name: Novus Role Sync code checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m compileall -q main.py common.py cogs tests
      - name: Install Discord for runtime command tests
        run: python -m pip install "discord.py>=2,<3"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
